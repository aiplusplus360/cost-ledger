[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-ledger"
version = "0.1.0"
description = "Attribute LLM spend to tenants and reconcile it against provider invoices."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["llm", "cost", "billing", "accounting", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/cost-ledger"

[project.scripts]
cost-ledger = "costledger.cli:main"

[tool.setuptools.packages.find]
include = ["costledger*"]
